# MySQL (Aiven, Clever Cloud or a local MySQL).
# Fill in the values below, OR leave them and set the environment variables
# DB_URL, DB_USER, DB_PASSWORD (recommended for a live site so no password is stored in code).
#
# Aiven example URL:
#   jdbc:mysql://mysql-xxxx-yourproject.h.aivencloud.com:18903/ecommerce_db?sslMode=REQUIRED
# Local MySQL example URL:
#   jdbc:mysql://localhost:3306/ecommerce_db
#
# Create the database once before the first run:   CREATE DATABASE ecommerce_db;
spring.datasource.url=${DB_URL:jdbc:mysql://YOUR_HOST:YOUR_PORT/ecommerce_db?sslMode=REQUIRED}
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD:YOUR_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Free cloud databases allow only a few connections at once
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}

# update = create missing tables/columns, keep existing data
spring.jpa.hibernate.ddl-auto=update

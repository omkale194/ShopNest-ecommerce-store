# ---------------------------------------------------------------
#  ShopNest backend - common settings
#  Switch database by changing the profile below:
#     h2    -> in-memory database, runs instantly, data is lost on restart
#     mysql -> your MySQL (Aiven / Clever Cloud / local). Edit application-mysql.properties
#  You can also override it without editing: set the env var SPRING_PROFILES_ACTIVE=mysql
# ---------------------------------------------------------------
spring.application.name=ecommerce-store
spring.profiles.active=h2

server.port=${PORT:8080}

# Keeps lazy loading working while the response is built (fine for this project)
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update

# We use JWT, so Spring's auto-generated demo user/password is not needed
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# JWT (change the secret for a live site; it must be at least 32 characters)
app.jwt.secret=${JWT_SECRET:change-this-secret-key-change-this-secret-key-2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Browsers allowed to call the API (comma separated; * wildcards allowed, e.g. https://*.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# First admin account, created automatically when the database has no admin yet
app.admin.name=Store Admin
app.admin.email=${ADMIN_EMAIL:admin@shop.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# Sample categories and products are inserted only when the database is empty
app.seed.enabled=${SEED_ENABLED:true}

# In-memory H2 database: nothing to install. Data resets every time the app restarts.
spring.datasource.url=jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Browser database viewer: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:ecommerce, user: sa, empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
